name: Daily 7:00 AM Data Sync & Deploy

on:
  schedule:
    # 00:00 UTC = 07:00 AM Thailand Time (UTC+7)
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub UI

permissions:
  contents: write

jobs:
  sync-data:
    name: Sync CMC100 Daily Index
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch Latest CMC100 Snapshot
        run: node scripts/sync-daily.js

      - name: Commit and Push Updated Data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/cmc100.json
          if git diff --staged --quiet; then
            echo "No changes in CMC100 constituents."
          else
            git commit -m "chore(data): daily 07:00 AM CMC100 sync [$(date -u +'%Y-%m-%d %H:%M UTC')]"
            git push
          fi
